<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <script>
      //首屏同步读取偏好,未选择或存储不可用时默认浅色
      let preference='light';
      try{
        const saved = localStorage.getItem('ymoj-theme');
        if (['light','dark'].includes(saved)) {
          preference=saved;
        }
      }catch{
        //浏览器隐私设置可能拒绝 localStorage
        //默认light
        preference='light';
      }
      const dark=preference==='dark';
      document.documentElement.dataset.themePreference=preference;
      document.documentElement.classList.toggle('dark', dark);
      document.documentElement.style.colorScheme=dark?'dark':'light';
    </script>
    <link rel="icon" type="image/png" href="/ymoj-icon.png">
    <link rel="apple-touch-icon" href="/ymoj-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YMOJ</title>
    <style>
      :root {
        --ym-surface-page: #f8f8f9;
        --ym-primary: #2d8cf0;
        --ym-warning: #ff9900;
        --ym-loader-text: #3498db;
      }

      html.dark {
        --ym-surface-page: #000000;
        --ym-primary: #409eff;
        --ym-warning: #e6a23c;
        --ym-loader-text: #409eff;
      }

      @-webkit-keyframes enter {
        0% {
          opacity: 0;
          top: -10px;
        }
  
        5% {
          opacity: 1;
          top: 0px;
        }
  
        50.9% {
          opacity: 1;
          top: 0px;
        }
  
        55.9% {
          opacity: 0;
          top: 10px;
        }
      }
  
      @keyframes enter {
        0% {
          opacity: 0;
          top: -10px;
        }
  
        5% {
          opacity: 1;
          top: 0px;
        }
  
        50.9% {
          opacity: 1;
          top: 0px;
        }
  
        55.9% {
          opacity: 0;
          top: 10px;
        }
      }
  
      @-moz-keyframes enter {
        0% {
          opacity: 0;
          top: -10px;
        }
  
        5% {
          opacity: 1;
          top: 0px;
        }
  
        50.9% {
          opacity: 1;
          top: 0px;
        }
  
        55.9% {
          opacity: 0;
          top: 10px;
        }
      }
  
      body {
        background: var(--ym-surface-page);
      }
  
      #app-loader {
        position: absolute;
        left: 50%;
        top: 50%;
        margin-left: -27.5px;
        margin-top: -27.5px;
      }
  
      #app-loader .square {
        background: var(--ym-primary);
        width: 15px;
        height: 15px;
        float: left;
        top: -10px;
        margin-right: 5px;
        margin-top: 5px;
        position: relative;
        opacity: 0;
        -webkit-animation: enter 6s infinite;
        animation: enter 6s infinite;
      }
  
      #app-loader .enter {
        top: 0px;
        opacity: 1;
      }
  
      #app-loader .square:nth-child(1) {
        -webkit-animation-delay: 1.8s;
        -moz-animation-delay: 1.8s;
        animation-delay: 1.8s;
      }
  
      #app-loader .square:nth-child(2) {
        -webkit-animation-delay: 2.1s;
        -moz-animation-delay: 2.1s;
        animation-delay: 2.1s;
      }
  
      #app-loader .square:nth-child(3) {
        -webkit-animation-delay: 2.4s;
        -moz-animation-delay: 2.4s;
        animation-delay: 2.4s;
        background: var(--ym-warning);
      }
  
      #app-loader .square:nth-child(4) {
        -webkit-animation-delay: 0.9s;
        -moz-animation-delay: 0.9s;
        animation-delay: 0.9s;
      }
  
      #app-loader .square:nth-child(5) {
        -webkit-animation-delay: 1.2s;
        -moz-animation-delay: 1.2s;
        animation-delay: 1.2s;
      }
  
      #app-loader .square:nth-child(6) {
        -webkit-animation-delay: 1.5s;
        -moz-animation-delay: 1.5s;
        animation-delay: 1.5s;
      }
  
      #app-loader .square:nth-child(8) {
        -webkit-animation-delay: 0.3s;
        -moz-animation-delay: 0.3s;
        animation-delay: 0.3s;
      }
  
      #app-loader .square:nth-child(9) {
        -webkit-animation-delay: 0.6s;
        -moz-animation-delay: 0.6s;
        animation-delay: 0.6s;
      }
  
      #app-loader .clear {
        clear: both;
      }
  
      #app-loader .last {
        margin-right: 0;
      }
  
      #app-loader .loader-content {
        color: var(--ym-loader-text);
        font-size: 16px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="app-loader">
      <div class="square"></div>
      <div class="square"></div>
      <div class="square last"></div>
      <div class="square clear"></div>
      <div class="square"></div>
      <div class="square last"></div>
      <div class="square clear"></div>
      <div class="square "></div>
      <div class="square last"></div>
      <div class="loader-content">
        <span>Loading...</span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
