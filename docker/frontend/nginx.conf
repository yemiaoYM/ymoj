worker_processes 2;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    server_tokens off;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 120m;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    gzip on;
    gzip_static on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Web 更新后容器地址可能改变，通过 Docker DNS 自动刷新上游地址。
    upstream ymcloud_backend {
        zone ymcloud_backend 64k;
        server web:9091 resolve;
    }

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # 内部 Worker 接口及健康检查仅允许容器网络访问，不经过公网代理。
        location ~ "^/(?:[^/]+/)*(?:internal|actuator)(?:[;/]|$)" {
            return 404;
        }

        location = /api {
            return 404;
        }

        location /api/ {
            proxy_pass http://ymcloud_backend/;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 120s;
        }

        location /files/ {
            proxy_pass http://ymcloud_backend;
            proxy_buffering off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 120s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location = /index.html {
            add_header Cache-Control "no-cache";
        }
    }
}
