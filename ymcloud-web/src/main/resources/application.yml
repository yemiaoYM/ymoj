ymcloud:
    file:
        base-dir: /Java/ymcloud/files
        judge-sh: /mnt/e/Java/ymcloud/files/private/docker/
        base-path: /mnt/e/Java/ymcloud/files

server:
    port: 9091
spring:
    application:
      name: ymcloud
    profiles:
        active: prod
    servlet:
        multipart:
            # 单个文件大小
            max-file-size: 5MB
            # 设置总上传的文件大小
            max-request-size: 10MB
    rabbitmq:
        listener:
            simple:
                prefetch: 1 #确保同一时刻最多投递给消费者1条消息
                acknowledge-mode: auto
                retry:
                    enabled: true
                    initial-interval: 1000ms
                    multiplier: 1.1
                    max-attempts: 3
        connection-timeout: 1s #设置MQ的连接超时时间
        #这只是连接失败的重试
        template:
            retry:
                enabled: true #开启超时重传机制
                initial-interval: 1000ms #失败后的初始等待
                multiplier: 1.1 #失败后下次的等待时间，下次等待时间=initial-interval*multiplier
                max-attempts: 3 #最大重试次数

# mybatis-plus配置
mybatis-plus:
    #mapper配置文件
    mapper-locations: classpath*:mapper/**/*Mapper.xml
    configuration:
        #在控制台输出日志
        log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
        #开启驼峰命名
        map-underscore-to-camel-case: true
        #全局枚举处理器
        default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
    global-config:
      db-config:
          #id为雪花策略
          id-type: assign_id
          #更新策略：只更新非空字段
          update-strategy: not_null
          #逻辑删除的配置（可以是Boolean，Integer）
          logic-delete-field: deleted
          logic-delete-value: 1
          logic-not-delete-value: 0

# token配置
token:
    # 令牌自定义标识
    header: Authorization
    # 令牌密钥
    secret: Ymcloud@OJ&KF2RcAB%ybsoy&2S7jhP^SW!q!Z^FK7eB7F8CcxIHsIh4Ll3pL^#
    # 令牌有效期（默认30分钟）
    expireTime: 30

# 用户配置
user:
    password:
        # 密码最大错误次数
        maxRetryCount: 5
        # 密码锁定时间（默认10分钟）
        lockTime: 10

# 日志配置
logging:
    level:
        com.baomidou.mybatis-plus: DEBUG
    pattern:
        dateformat: MM-dd HH:mm:ss:SSS