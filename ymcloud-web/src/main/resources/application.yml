ymcloud:
    file:
        # 默认项目根目录/files；独立 jar 使用 jar 所在目录，自动创建 public/private。
        # 已有部署可通过 YMCLOUD_FILE_BASE_DIR 指定绝对路径，继续使用原目录。
        base-dir: ${YMCLOUD_FILE_BASE_DIR:./files}
    docker:
        # 默认文件根目录/tmp，可通过 YMCLOUD_JUDGE_WORK_DIR 单独指定工作目录。
        host-working-dir: ${YMCLOUD_JUDGE_WORK_DIR:${ymcloud.file.base-dir}/tmp}
        container-working-dir: /app
    judge:
        # 版本化任务由 OJ 配置维护，不依赖对象存储安装脚本。
        exchange: ${YMCLOUD_JUDGE_EXCHANGE:judge.storage-v1.topic}
        task-queue: ${YMCLOUD_JUDGE_TASK_QUEUE:judge.storage-v1.queue}
        result-queue: ${YMCLOUD_JUDGE_RESULT_QUEUE:judge.storage-v1.result.queue}

server:
    port: 9091
    address: 127.0.0.1
    tomcat:
        # 上传文件数列控制
        max-part-count: 100
spring:
    datasource:
        druid:
            connection-properties: openTelemetry=${YMCLOUD_JDBC_TELEMETRY:DISABLED}
    application:
      name: ymcloud
    profiles:
        active: dev
    servlet:
        multipart:
            # 单个文件大小
            max-file-size: 50MB
            # 设置总上传的文件大小
            max-request-size: 120MB
    rabbitmq:
        listener:
            simple:
                prefetch: 1 #确保同一时刻最多投递给消费者1条消息
                acknowledge-mode: auto
                retry:
                    enabled: true
                    initial-interval: 1000ms
                    multiplier: 1.1
                    max-attempts: 3
        connection-timeout: 1s #设置MQ的连接超时时间
        #这只是连接失败的重试
        template:
            retry:
                enabled: true #开启超时重传机制
                initial-interval: 1000ms #失败后的初始等待
                multiplier: 1.1 #失败后下次的等待时间，下次等待时间=initial-interval*multiplier
                max-attempts: 3 #最大重试次数

# mybatis-plus配置
mybatis-plus:
    #mapper配置文件
    mapper-locations: classpath*:mapper/**/*Mapper.xml
    configuration:
        #在控制台输出日志
        # 文件、用户和存储配置含敏感字段，不向控制台打印 SQL 参数或查询结果。
        log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
        #开启驼峰命名
        map-underscore-to-camel-case: true
        #全局枚举处理器
        default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
    global-config:
      db-config:
          #id为雪花策略
          id-type: assign_id
          #更新策略：只更新非空字段
          update-strategy: not_null
          #逻辑删除的配置（可以是Boolean，Integer）
          logic-delete-field: deleted
          logic-delete-value: 1
          logic-not-delete-value: 0

#邮箱配置
mail:
    from: yourEmail
    pass: yourEmailPass

# token配置
token:
    # 令牌自定义标识
    header: Authorization
    # 令牌密钥
    secret: Ymcloud
    # 令牌有效期（默认30分钟）
    expireTime: 60

# 用户配置
user:
    password:
        # 密码最大错误次数
        maxRetryCount: 5
        # 密码锁定时间（默认10分钟）
        lockTime: 10

# 日志配置
logging:
    charset:
        # console: UTF-8
        file: UTF-8
    level:
        com.baomidou.mybatis-plus: DEBUG
    pattern:
        dateformat: MM-dd HH:mm:ss:SSS
